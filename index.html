<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding</title>
     <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-image:url('background.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            
        }
        .katayam{
           margin-left: 400px;
           margin-top: -170px;
           
        }
        .kimage{
            display: block;
            width: 50%;
        }
        @media (max-width: 768px) {
            .katayam{
                margin-left: 15%;
                margin-top: -30px;
            }
            .kimage{
                width: 80%;
            }
            .wetext{
                margin-left: 100px;
            }
        }

        .wetext{
            letter-spacing: 2px;
            font-family: "Anton", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 15px;
            margin-left: 20%;
            color: #b59049;
        }
       

        .divider{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            margin: 15px auto;
        }

        diamond{
            width: 6px;
            height: 6px;
            background: #b59049;
            transform: rotate(45deg);
            margin: 0 10px;
        }

        .divider::before,.divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #b59049;
        }

        .yuvala{
            text-align: center;
            color: #8a6f3a;
        }
        .date{
            text-align: center;
            color: #b59049;
        }
        .invite{
            background: transparent;
            border: 2.5px solid transparent;

            background-image: linear-gradient(90deg, #b59049, #e8dcc4, #b59049);

            color: #b59049;
            font-family: "Anton" , sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            padding: 14px 35px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            margin-left: 20%;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .invite:hover{
            background: #b59049;
            color: #fff;
        }
        .open{
            text-decoration: none;
            color: #8a6f3a;
        }
        .open:hover{
            color: wheat;
        }

        .natum{
            display: block;
            max-width: 100%;
            height: auto;
            align-items: center;
            margin: 0 auto;
        }


        /*slide animate*/
        /* Page Transition Overlay එක */
/* පේජ් එක යටට තල්ලු නොවන, හිස් ඉඩ නොහැදෙන නව Overlay CSS එක */
.page-transition-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #1a1816; /* ඔයාගේ Theme එකේ Dark Color එක */
  z-index: 99999;
  pointer-events: none;
  opacity: 0;
  visibility: hidden; /* මේකෙන් පේජ් එක යට කිසිම හිස් ඉඩක් හැදෙන්නේ නැහැ */
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

/* Button එක Click කරපු ගමන් Slide නොවී Smooth එකේ Fade වෙනවා */
.page-transition-overlay.is-active {
  opacity: 1;
  visibility: visible;
  pointer-events: all;
}

/* අලුත් Page එකට ආපු ගමන් මුළු Page එකම ලස්සනට Smooth වී Open වීම */
body {
  animation: pageFadeIn 0.6s ease-out forwards;
}

@keyframes pageFadeIn {
  from {
    opacity: 0;
    transform: scale(0.98); /* පොඩියට ඉඳන් ලොකු වෙන Effect එකක් */
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* (Optional) Button එකේ Style එක */
.transition-btn {
  display: inline-block;
  padding: 12px 25px;
  background-color: #723c4a;
  color: #ffffff;
  text-decoration: none;
  border-radius: 25px;
  font-family: sans-serif;
  font-weight: bold;
  transition: transform 0.2s ease;
}

.transition-btn:active {
  transform: scale(0.95);
}


        </style>
</head>
<body>
    <div class="page-transition-overlay"></div>

    <div class="katayam">
        <img src="katayam.png" alt="katayam" class="kimage">
        <p class="wetext">THE WEDDING OF</p>
    </div> <br>

    <div class="divider">
        <span class="diamond"></span>
    </div> <br>
    <h1 class="yuvala">Yasantha & Malmi</h1> <br>
    <p class="date">Thursday, 10<span style="vertical-align: super;">th</span> December 2026</p> <br>
    <p style="color: #b59049;" class="date">Time : 9.00 A.M. To 4.00 P.M.</p>
    <br> <br>
    <a href="2.html" class="open"><button class="invite" onclick="goToPage2()" class="transition-btn">OPEN INVITATION</button> </a> <br>
    <div class="natum">
        <img src="natum.png" alt="preaheta" style="width: 100%;">
    </div>

    <script>
    function goToPage2() {
        // Permission Flag එක සෙට් කරලා Page 2 එකට යනවා
        sessionStorage.setItem('allowAccess', 'true');
        window.location.href = '2.html';
    }


    //slide trans
    document.addEventListener('DOMContentLoaded', () => {
  const transitionButtons = document.querySelectorAll('.transition-btn');
  const overlay = document.querySelector('.page-transition-overlay');

  transitionButtons.forEach(button => {
    button.addEventListener('click', function(e) {
      e.preventDefault(); // එකපාරටම Page එක Reload වෙන එක නවත්වනවා
      
      const targetUrl = this.getAttribute('href'); // යා යුතු Page එකේ Link එක
      
      // Overlay Animation එක Active කරනවා
      if (overlay) {
        overlay.classList.add('is-active');
      }

      // Animation එක ඉවර වුණ ගමන් (මිලිසෙකන්ඩ් 500කින්) අලුත් පේජ් එකට යනවා
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 500);
    });
  });
});


// URL එකෙන් නම ගන්නවා
 const urlParams = new URLSearchParams(window.location.search);
  const guestName = urlParams.get('name'); 
  const inviteType = urlParams.get('type');

  // නම සහ ආසන ගාන තාවකාලිකව Memory එකේ සේව් කිරීම
  if (guestName) {
    sessionStorage.setItem('weddingGuestName', guestName);
  }
  if (inviteType) {
    sessionStorage.setItem('weddingInviteType', inviteType);
  }
</script>
</body>
</html>
